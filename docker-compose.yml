services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: radar
    ports:
      - "5434:5432"          # 5433 вже зайнято underInsight_postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d radar"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"          # 6380 вже зайнято контейнером redis від undertalk
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"          # AMQP
      - "15673:15672"        # веб-панель: http://localhost:15673  (lab/lab)
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
