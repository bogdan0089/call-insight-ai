services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: radar
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d radar"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10

  api:
    build: .
    ports:
      - "8090:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://lab:lab@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lab:lab@rabbitmq:5672//
      STORAGE_DIR: /app/storage
    volumes:
      - audio:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://lab:lab@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lab:lab@rabbitmq:5672//
      STORAGE_DIR: /app/storage
    volumes:
      - audio:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info

volumes:
  pgdata:
  audio:
