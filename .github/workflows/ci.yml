name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: radar
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U lab -d radar"
          --health-interval 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://lab:lab@localhost:5434/radar
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://lab:lab@localhost:5672//

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Migrations apply on an empty database
        run: alembic upgrade head

      - name: Migrations have a single head
        run: |
          heads=$(alembic heads | grep -c "(head)")
          if [ "$heads" -ne 1 ]; then
            alembic heads
            echo "::error::Expected one migration head, found $heads"
            exit 1
          fi

      - name: Models match migrations
        run: alembic check

      - name: Migrations roll back and reapply
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
